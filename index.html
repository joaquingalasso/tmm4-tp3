<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audere</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; cursor: none; }
  #pantalla { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; }
  #debug {
    position: fixed; left: 10px; top: 10px; margin: 0; padding: 10px 12px;
    background: rgba(0,0,0,0.78); color: #b7c5d0; font: 12px/1.45 ui-monospace, Consolas, monospace;
    border: 1px solid #2a3440; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
  <canvas id="pantalla" width="1920" height="1080"></canvas>
  <pre id="debug" hidden></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
